<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Undangan pernikahan berbentuk game 3D. Masuk ke gedung resepsi dan kunjungi pilar Acara, Lokasi, Galeri, Cerita, RSVP, dan Ucapan.">
<meta name="theme-color" content="#a7dcf2">
<title>Undangan Pernikahan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: full-screen 3D farm you walk around in; HUD = parchment boxes with wooden frames, like a farm-sim dialog. One daytime look on purpose (single theme, every color explicit). */
:root{
  color-scheme: light;
  --sky:#a7dcf2;
  --paper:#fff4dc;
  --paper-2:#f1ddb0;
  --wood:#8a5532;
  --wood-dk:#4f2e18;
  --ink:#3a2414;
  --ink-2:#7a5a3e;
  --rose:#e0566f;
  --rose-dk:#b23a53;
  --leaf:#4f9a3a;
  --gold:#f2b23a;
  --white:#ffffff;
  --shade:rgba(48,24,8,.38);
  --f-display:"Baloo 2","Nunito",system-ui,-apple-system,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-pixel:"Pixelify Sans","Baloo 2",ui-monospace,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.frame{background:var(--paper);border:3px solid var(--wood-dk);border-radius:14px;box-shadow:inset 0 0 0 3px var(--paper-2),0 4px 0 var(--wood-dk),0 10px 22px rgba(60,30,10,.22)}
.pix{font-family:var(--f-pixel);letter-spacing:.04em}

.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.hud > *{pointer-events:auto}
.tl{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;padding:8px 14px 9px;max-width:min(60vw,320px);display:flex;flex-direction:column;gap:1px}
.eyebrow{font-family:var(--f-pixel);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.tl strong{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.05;color:var(--rose-dk);overflow-wrap:anywhere}
.tl .sub{font-size:12.5px;font-weight:700;color:var(--ink)}
.demo{align-self:flex-start;margin-top:4px;font-family:var(--f-pixel);font-size:10px;letter-spacing:.06em;background:var(--paper-2);color:var(--wood-dk);border-radius:6px;padding:1px 6px}
.tr{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:11px;font-family:var(--f-pixel);font-size:13px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.chip.btn-chip{border:3px solid var(--wood-dk)}
.chip.off{opacity:.7}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;transform:rotate(45deg);border:2px solid var(--wood-dk);background:transparent;display:block;border-radius:2px}
.dots i.on{background:var(--c)}

.toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(96px + env(safe-area-inset-top,0px));padding:8px 14px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center;pointer-events:none}

#joy{position:absolute;left:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(255,244,220,.55);border:3px solid rgba(79,46,24,.75);box-shadow:inset 0 0 0 3px rgba(241,221,176,.7);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--rose);border:3px solid var(--wood-dk);box-shadow:0 3px 0 var(--wood-dk)}
.act{position:absolute;right:18px;bottom:calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.actlabel{padding:5px 11px;font-weight:800;font-size:14px;border-radius:11px;white-space:nowrap}
#btnA{width:78px;height:78px;border-radius:50%;background:var(--rose);color:var(--white);border:3px solid var(--wood-dk);box-shadow:0 5px 0 var(--wood-dk);font-family:var(--f-pixel);font-size:30px;font-weight:700;touch-action:manipulation}
#btnA:disabled{background:#c9b79a;color:var(--paper);cursor:default}
#btnA:not(:disabled):active{transform:translateY(3px);box-shadow:0 2px 0 var(--wood-dk)}
.hud.busy #joy,.hud.busy .act{visibility:hidden}

.dialog{position:fixed;z-index:6;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;padding:22px 20px 18px;min-height:112px;cursor:pointer}
.nameplate{position:absolute;top:-16px;left:16px;background:var(--rose);color:var(--white);border:3px solid var(--wood-dk);border-radius:10px;padding:2px 12px;font-family:var(--f-pixel);font-weight:700;font-size:14px;letter-spacing:.04em}
#dlgText{margin:0;font-size:17px;line-height:1.5;font-weight:600;min-height:3em}
.more{position:absolute;right:16px;bottom:8px;color:var(--rose-dk);font-size:13px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.sheetwrap{position:fixed;inset:0;z-index:5;background:var(--shade);display:grid;place-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet{width:min(470px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:text;user-select:text}
.sh-head{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 16px;border-bottom:3px dashed var(--paper-2)}
.sh-dot{width:16px;height:16px;transform:rotate(45deg);border:3px solid var(--wood-dk);border-radius:3px;flex:none}
.sh-head h2{margin:0;flex:1;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;color:var(--wood-dk);text-wrap:balance}
.x{width:40px;height:40px;border-radius:10px;border:3px solid var(--wood-dk);background:var(--paper-2);font-weight:800;flex:none}
.sh-body{overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sh-body p{margin:0;line-height:1.55}
.lead{font-size:15px}
.note{font-size:13px;color:var(--ink-2)}
.couple{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.couple b{display:block;font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.15;color:var(--rose-dk)}
.couple small{display:block;font-size:12px;color:var(--ink-2);margin-top:3px}
.amp{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--gold)}
.bigdate{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;background:var(--paper-2);border-radius:10px;padding:10px 12px}
.bigdate .pix{font-size:15px;font-weight:700}
.cd{font-family:var(--f-pixel);font-weight:700;background:var(--rose);color:var(--white);border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums}
.ev{border:2px solid var(--paper-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ev h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--wood-dk)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px}
dt{font-family:var(--f-pixel);font-size:12px;letter-spacing:.06em;color:var(--ink-2);padding-top:2px}
dd{margin:0;font-weight:700;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:11px;border:3px solid var(--wood-dk);background:var(--rose);color:var(--white);font-weight:800;font-size:15px;text-decoration:none;box-shadow:0 3px 0 var(--wood-dk);touch-action:manipulation}
.btn.ghost{background:var(--paper-2);color:var(--wood-dk)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-dk)}
.btn.big{font-size:18px;padding:12px 22px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.addr{font-weight:700;font-size:15px;background:var(--paper-2);border-radius:10px;padding:10px 12px;line-height:1.45}
.mapcv{width:100%;height:auto;border-radius:12px;border:2px solid var(--paper-2);display:block}

.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.pol{background:var(--white);padding:7px 7px 6px;border-radius:4px;box-shadow:0 3px 8px rgba(60,30,10,.2);border:none;text-align:left;display:flex;flex-direction:column;gap:5px;transform:rotate(var(--r,0deg))}
.pol canvas{width:100%;height:auto;display:block;border-radius:2px}
.pol span{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.25}

.tl-list{list-style:none;margin:0;padding:0 0 0 4px;display:flex;flex-direction:column;gap:14px;position:relative}
.tl-list::before{content:"";position:absolute;left:30px;top:6px;bottom:6px;width:3px;background:var(--paper-2);border-radius:2px}
.tl-list li{display:grid;grid-template-columns:56px 1fr;gap:12px;position:relative}
.yr{font-family:var(--f-pixel);font-weight:700;font-size:13px;background:var(--leaf);color:var(--white);border:3px solid var(--wood-dk);border-radius:9px;text-align:center;padding:2px 0;align-self:start;position:relative;z-index:1}
.tl-list h4{margin:2px 0 3px;font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--wood-dk)}
.tl-list p{font-size:14.5px}

form{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-family:var(--f-pixel);font-size:12px;letter-spacing:.06em;color:var(--ink-2)}
input[type=text],select,textarea{background:var(--white);border:3px solid var(--paper-2);border-radius:10px;padding:9px 11px;font-family:var(--f-body);font-size:16px;font-weight:600;color:var(--ink);letter-spacing:0;width:100%;box-sizing:border-box}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--wood);outline:none}
textarea{min-height:84px;resize:vertical}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
legend{font-family:var(--f-pixel);font-size:12px;letter-spacing:.06em;color:var(--ink-2);padding:0;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{position:relative}
.opts input{position:absolute;opacity:0;inset:0}
.opts span{display:inline-block;padding:7px 12px;border-radius:10px;border:3px solid var(--paper-2);background:var(--white);font-weight:700;font-size:14px}
.opts input:checked + span{border-color:var(--wood-dk);background:var(--gold)}
.opts input:focus-visible + span{outline:3px solid var(--gold);outline-offset:2px}
.out{display:flex;flex-direction:column;gap:10px;border-top:3px dashed var(--paper-2);padding-top:12px}
.out pre{margin:0;white-space:pre-wrap;font-family:var(--f-body);font-size:14px;background:var(--paper-2);border-radius:10px;padding:10px 12px;line-height:1.5}
.ok-msg{margin:0;font-weight:700;background:var(--leaf);color:var(--white);border-radius:10px;padding:10px 12px;line-height:1.45}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:inline-flex;align-items:baseline;gap:5px;background:var(--paper-2);border-radius:9px;padding:5px 9px;font-size:13px;font-weight:700}
.stat b{font-family:var(--f-pixel);font-size:16px;color:var(--wood-dk);font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:10px;border-top:3px dashed var(--paper-2);padding-top:14px}
.sec-h{margin:0;font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--wood-dk)}
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:2px solid var(--paper-2);border-radius:12px;overflow:hidden}
.glist li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:2px solid var(--paper-2);min-width:0}
.glist li:first-child{border-top:0}
.gname{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcount{flex:none;font-size:12.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.pill{flex:none;font-family:var(--f-pixel);font-size:11px;letter-spacing:.04em;border-radius:7px;padding:1px 7px;border:2px solid var(--wood-dk)}
.pill.h{background:var(--leaf);color:var(--white)}
.pill.r{background:var(--gold);color:var(--ink)}
.pill.t{background:var(--paper-2);color:var(--ink-2)}
.wishes{display:flex;flex-direction:column;gap:10px}
.wish{background:var(--white);border:2px solid var(--paper-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wish header{display:flex;align-items:center;gap:8px;min-width:0}
.wish strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:16px;color:var(--wood-dk)}
.wish time{margin-left:auto;font-size:12px;color:var(--ink-2);flex:none}
.wish p{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{list-style:none;font-size:14px;color:var(--ink-2);background:var(--paper-2);border-radius:10px;padding:12px;text-align:center}
.more-btn{align-self:center}
.btn:disabled{opacity:.6;cursor:default}

.lb{position:fixed;inset:0;z-index:7;background:var(--shade);display:grid;place-items:center;padding:16px}
.lb figure{margin:0;width:min(560px,100%);padding:12px;display:flex;flex-direction:column;gap:10px}
.lb canvas{width:100%;height:auto;border-radius:6px;display:block}
.lb figcaption{font-weight:800;text-align:center}
.lb-nav{display:flex;justify-content:space-between;gap:8px}
.lb-nav button{flex:1;padding:8px 6px;border-radius:10px;border:3px solid var(--wood-dk);background:var(--paper-2);font-weight:800;font-size:14px}

.cover{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(167,220,242,.15),rgba(48,24,8,.28))}
.cover-card{width:min(400px,100%);padding:22px 22px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.cover h1{margin:2px 0 0;font-family:var(--f-display);font-weight:800;font-size:clamp(34px,11vw,48px);line-height:.95;color:var(--rose-dk);display:flex;flex-direction:column;align-items:center;text-wrap:balance}
.cover h1 .amp{font-size:.7em;line-height:1.1}
.cv-date{margin:0;font-family:var(--f-pixel);font-weight:700;font-size:15px}
.cv-guest{display:flex;flex-direction:column;gap:2px;background:var(--paper-2);border-radius:10px;padding:8px 18px;min-width:70%}
.cv-guest span{font-size:12px;color:var(--ink-2);font-weight:700}
.cv-guest strong{font-family:var(--f-display);font-size:20px;font-weight:800;color:var(--wood-dk);overflow-wrap:anywhere}
.cv-hint{margin:0;font-size:12.5px;color:var(--ink-2);font-weight:700}
.err{position:fixed;inset:auto 16px 16px;z-index:9;padding:12px 14px;font-weight:700}

@media (min-width:760px){
  .tl strong{font-size:24px}
  #joy{width:136px;height:136px}
}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
</style>
</head>
<body>
<div id="hud" class="hud busy">
  <header class="tl frame">
    <span class="eyebrow">Undangan Pernikahan</span>
    <strong id="hudNames">Aji &amp; Vania</strong>
    <span class="sub" id="hudDate">10 Jul 2027</span>
    <span class="demo">DATA CONTOH</span>
  </header>
  <div class="tr">
    <span class="chip frame" id="chipCd">H-0</span>
    <span class="chip frame" id="chipProg" title="Pilar yang sudah dikunjungi"><span class="dots" id="dots"></span><span id="progTxt">0/5</span></span>
    <button class="chip frame btn-chip off" id="btnMusic" aria-pressed="false">♪ Musik</button>
  </div>
  <div id="toast" class="toast frame" hidden></div>
  <div id="joy" aria-hidden="true"><div id="knob"></div></div>
  <div class="act">
    <span id="actLabel" class="actlabel frame" hidden>Lihat</span>
    <button id="btnA" aria-label="Aksi" disabled>A</button>
  </div>
</div>

<div id="dialog" class="frame dialog" hidden aria-live="polite">
  <span id="dlgName" class="nameplate">Papan</span>
  <p id="dlgText"></p>
  <span class="more" aria-hidden="true">▼</span>
</div>

<div id="sheetWrap" class="sheetwrap" hidden>
  <section id="sheet" class="sheet frame" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header class="sh-head">
      <span class="sh-dot" id="sheetDot"></span>
      <h2 id="sheetTitle">Acara</h2>
      <button id="sheetClose" class="x" aria-label="Tutup">✕</button>
    </header>
    <div id="sheetBody" class="sh-body"></div>
  </section>
</div>

<div id="lb" class="lb" hidden>
  <figure class="frame">
    <canvas id="lbCanvas" width="800" height="600"></canvas>
    <figcaption id="lbCap"></figcaption>
    <div class="lb-nav">
      <button id="lbPrev">‹ Sebelumnya</button>
      <button id="lbClose">Tutup</button>
      <button id="lbNext">Berikutnya ›</button>
    </div>
  </figure>
</div>

<div id="cover" class="cover">
  <div class="cover-card frame">
    <span class="eyebrow">Undangan Pernikahan</span>
    <h1><span id="cvG">Aji</span><span class="amp">&amp;</span><span id="cvB">Vania</span></h1>
    <p class="cv-date" id="cvDate">Sabtu, 10 Juli 2027</p>
    <div class="cv-guest"><span>Kepada Yth.</span><strong id="cvGuest">Tamu Undangan</strong></div>
    <button id="btnOpen" class="btn big">Buka Undangan</button>
    <p class="cv-hint">Masuk ke gedung resepsi untuk lihat info acara</p>
  </div>
</div>

<div id="err" class="err frame" hidden>Mesin 3D gagal dimuat. Coba muat ulang halaman.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
"use strict";
/* =========================================================
   DATA UNDANGAN — ganti bagian ini dengan data asli kalian
   ========================================================= */
const W = {
  groom:{ nick:'Aji',  full:'Aji', parents:'Putra dari Bapak Hendra & Ibu Sri' },
  bride:{ nick:'Vania', full:'Vania',  parents:'Putri dari Bapak Agus & Ibu Rina' },
  dateISO:'2027-07-10',
  dateLabel:'Sabtu, 10 Juli 2027',
  dateShort:'Sabtu, 10 Jul 2027',
  events:[
    { name:'Akad Nikah', time:'08.00 – 10.00 WIB', start:'2027-07-10T08:00:00+07:00', end:'2027-07-10T10:00:00+07:00',
      place:'Masjid Al-Ikhlas, Kebayoran Baru, Jakarta Selatan', note:'Terbatas untuk keluarga dan kerabat dekat.' },
    { name:'Resepsi', time:'11.00 – 14.00 WIB', start:'2027-07-10T11:00:00+07:00', end:'2027-07-10T14:00:00+07:00',
      place:'Gedung Serbaguna Melati, Jakarta Selatan', note:'' }
  ],
  venue:{ name:'Gedung Serbaguna Melati', address:'Jl. Melati Raya No. 12, Kebayoran Baru, Jakarta Selatan', parking:'Parkir tersedia di basement gedung.' },
  dresscode:'Nuansa pastel atau earth tone.',
  hashtag:'#AjiVaniaTumbuhBersama',
  wa:'6281234567890',
  story:[
    { yr:'2019', title:'Satu kelompok KKN', text:'Ketemu pertama kali di desa tempat KKN. Satu ngurus kebun, satu ngurus dokumentasi.' },
    { yr:'2021', title:'Mulai serius', text:'Dari teman diskusi tugas jadi teman pulang bareng setiap hari.' },
    { yr:'2025', title:'Lamaran', text:'Dengan restu dua keluarga, kami memutuskan untuk melangkah bersama.' },
    { yr:'2027', title:'Hari yang ditunggu', text:'Sekarang kami ingin merayakannya bersama kamu.' }
  ],
  gallery:[ 'Senja pertama', 'Pendakian bareng', 'Kota malam hari', 'Musim hujan', 'Kebun teh', 'Hari lamaran' ]
};

/* ---------- small utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function copyText(text, btn){
  const done = () => { const o = btn.textContent; btn.textContent = 'Tersalin'; setTimeout(() => btn.textContent = o, 1500); };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.cssText = 'position:fixed;opacity:0;left:0;top:0';
    document.body.appendChild(ta); ta.select();

}

/* static batch: everything that never moves is merged per color */
let SB = {};

function withBatch(target, fn){ const prev = SB; SB = target; try { fn(); } finally { SB = prev; } }
const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _m4 = new THREE.Matrix4();
function sb(geo, color, x, y, z, o){
  o = o || {};
  _e.set(o.rx||0, o.ry||0, o.rz||0, o.order || 'XYZ'); _q.setFromEuler(_e);
  const s = o.s || [1,1,1];
  _m4.compose(V3(x||0,y||0,z||0), _q, V3(s[0],s[1],s[2]));
  const g = nn(geo); g.applyMatrix4(_m4);
  if (g.attributes.uv === undefined) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2), 2));
  (SB[color] || (SB[color] = [])).push(g);
}
function flushSB(batch, parent, matFn){
  batch = batch || SB_MAIN; parent = parent || scene;
  for (const c in batch){
    const merged = BGU.mergeBufferGeometries(batch[c]);
    if (!merged) continue;
    const m = new THREE.Mesh(merged, matFn ? matFn(+c) : M(+c)); m.castShadow = true; m.receiveShadow = true; parent.add(m);
  }
}

function hotelFacadeTex(floors, cols, lit){

  const w = 1536, h = 512, fh = h/floors, cw = w/cols, rnd = mulberry32(77);

    c.fillStyle = lit ? '#000000' : '#e6d8bf'; c.fillRect(0,0,w,h);
    for (let f=0; f<floors; f++) for (let k=0; k<cols; k++){
      const x = k*cw + 10, y = f*fh + 16, ww = cw - 20, hh = fh - 40, on = rnd() < .38;
      if (lit){ if (on){ const g = c.createLinearGradient(0,y,0,y+hh); g.addColorStop(0,'#ffcf7a'); g.addColorStop(1,'#d98e3a'); c.fillStyle = g; c.fillRect(x, y, ww, hh); } continue; }

      c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(x + 4, y + 4, ww*.25, hh - 8);
      c.fillStyle = '#4a3a2c'; c.fillRect(k*cw + cw/2 - 2, y, 4, hh);
    }
    if (!lit){
      c.fillStyle = '#4a3a2c'; for (let f=0; f<=floors; f++) c.fillRect(0, f*fh - 6, w, 12);
      c.fillStyle = 'rgba(220,235,245,.55)'; for (let f=0; f<floors; f++) c.fillRect(0, f*fh + fh - 30, w, 10);

}

/* TV LED besar: daftar ucapan bergulir */
const tvState = { items:[], loaded:false, t:0, last:0 };
function wrapLines(c, text, maxW, maxLines){
  const words = String(text).split(/\s+/), lines = []; let cur = '';
  for (const w of words){
    const t = cur ? cur + ' ' + w : w;
    if (c.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; if (lines.length >= maxLines) break; }
    else cur = t;
  }
  if (lines.length < maxLines && cur) lines.push(cur);
  if (lines.length === maxLines && words.join(' ').length > lines.join(' ').length){ let l = lines[maxLines-1]; while (c.measureText(l + '…').width > maxW && l.length) l = l.slice(0, -1); lines[maxLines-1] = l + '…'; }
  return lines;
}
function drawTV(dt){
  if (!ledTV) return;
  tvState.t += dt;
  const c = ledTV.ctx, w = 1024, h = 576;
  const g = c.createLinearGradient(0,0,w,h); g.addColorStop(0,'#0f1633'); g.addColorStop(1,'#2a1238'); c.fillStyle = g; c.fillRect(0,0,w,h);
  // header
  c.fillStyle = 'rgba(212,175,55,.16)'; c.fillRect(0,0,w,92);
  c.fillStyle = '#e8c766'; c.font = '800 46px "Baloo 2","Nunito",sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'left';
  c.fillText('Ucapan & Doa', 40, 48);
  c.textAlign = 'right'; c.font = '700 28px "Pixelify Sans",monospace'; c.fillStyle = '#f6efe2';
  const total = rsvp.summary ? rsvp.summary.stats.wishes : tvState.items.length;
  c.fillText(total + ' ucapan', w - 40, 50);
  // daftar bergulir
  const top = 108, bottom = h - 70, cardH = 140, items = tvState.items;
  c.save(); c.beginPath(); c.rect(0, top, w, bottom - top); c.clip();
  if (!items.length){
    c.textAlign = 'center'; c.fillStyle = 'rgba(246,239,226,.85)'; c.font = '700 36px "Nunito",sans-serif';
    c.fillText(tvState.loaded ? 'Belum ada ucapan. Jadilah yang pertama!' : 'Ucapan dari tamu akan tampil di sini.', w/2, (top + bottom)/2);
  } else {
    const loopH = items.length * cardH, scroll = items.length > 3 ? (tvState.t * 34) % loopH : 0;

function applyExtFade(f){
  const e = f*f*(3 - 2*f);
  for (const m of extMats){
    const base = m.userData.baseOpacity != null ? m.userData.baseOpacity : 1;
    const wantT = e < .999 || base < 1 || !!m.userData.alwaysT;
    if (m.transparent !== wantT){ m.transparent = wantT; m.needsUpdate = true; }
    m.opacity = base * e; m.depthWrite = e > .6 && base >= 1;
  }
  EXT.visible = e > .002;
  EXT.position.y = (1 - e) * 3.2;
}

/* scatter: grass, flowers, bushes */
function freeSpot(x, z, pad){
  if (Math.abs(x) > 23.2 || z < -23.2 || z > 25.2) return false;
  if (x > BLD.x0 - 1 - pad && x < BLD.x1 + 1 + pad && z > BLD.z0 - 1 - pad && z < BLD.z1 + 6.4 + pad) return false;
  if (Math.abs(x) < 13.2 + pad && z > 1.4 - pad) return false;
  if (z > 4.4 - pad && z < 10.8 + pad) return false;
  for (const c of COLC) if (Math.hypot(x-c.x, z-c.z) < c.r+pad) return false;
  for (const b of COLB) if (Math.abs(x-b.x) < b.hw+pad && Math.abs(z-b.z) < b.hd+pad) return false;
  return true;
}
function scatter(){
  const tuft = BGU.mergeBufferGeometries([0,1,2].map(i => { const g = nn(new THREE.ConeGeometry(.07,.34,4)); g.translate(0,.17,0); g.rotateZ((i-1)*.35); g.translate((i-1)*.08,0,(i%2)*.05); return g; }));
  const N = 560, gI = inst(tuft, 0xffffff, N);
  let n = 0, guard = 0;
  while (n < N && guard++ < 20000){
    const x = (R()-.5)*48, z = (R()-.5)*50; if (!freeSpot(x,z,.3)) continue;
    dummy.position.set(x,0,z); dummy.rotation.set(0,R()*6,0); const s = .8+R()*.7; dummy.scale.set(s,s,s); dummy.updateMatrix();
    gI.setMatrixAt(n, dummy.matrix); gI.setColorAt(n, tmpC.setHex(R()<.5 ? 0x5fae3e : 0x6fbd47)); n++;
  }
  gI.count = n;
  const fl = BGU.mergeBufferGeometries([nn(ico(.11)).translate(0,.24,0), nn(cyl(.02,.02,.22,4)).translate(0,.11,0)]);
  const F = 260, fI = inst(fl, 0xffffff, F), fc = [0xf28aa3, 0xffffff, 0xf6c531, 0xb38be0, 0xe0566f];
  n = 0; guard = 0;
  while (n < F && guard++ < 20000){
    const cx = (R()-.5)*48, cz = (R()-.5)*48;
    for (let k=0;k<5 && n<F;k++){
      const x = cx + (R()-.5)*1.6, z = cz + (R()-.5)*1.6; if (!freeSpot(x,z,.25)) continue;
      dummy.position.set(x,0,z); dummy.rotation.set(0,0,0); const s = .8+R()*.6; dummy.scale.set(s,s,s); dummy.updateMatrix();
      fI.setMatrixAt(n, dummy.matrix); fI.setColorAt(n, tmpC.setHex(fc[(cx*7+cz*3|0) & 3 ? (k%5) : 2])); n++;
    }
  }
  fI.count = n;
  for (let i=0;i<34;i++){
    const x = (R()-.5)*47, z = (R()-.5)*47; if (!freeSpot(x,z,1)) continue;
    sb(jitter(ico(.55+R()*.3),.12), R()<.5 ? 0x4e9a3c : 0x5aa846, x, .35, z, { s:[1,.75,1] });
  }
}

let dog;
function makeDog(){

  const tan = 0xd9a066, dk = 0x8a5532;
  mesh(box(.42,.34,.72), tan, 0,.45,0,body);
  const head = new THREE.Group(); head.position.set(0,.74,.42); body.add(head);
  mesh(box(.38,.34,.36), tan, 0,0,0,head); mesh(box(.2,.14,.18), 0xf1d2a5, 0,-.06,.24,head);
  mesh(box(.08,.07,.05), 0x2a1a10, 0,-.01,.34,head);
  mesh(box(.06,.08,.03), 0x2a1a10, -.1,.06,.19,head); mesh(box(.06,.08,.03), 0x2a1a10, .1,.06,.19,head);
  mesh(box(.1,.2,.14), dk, -.2,.14,-.04,head); mesh(box(.1,.2,.14), dk, .2,.14,-.04,head);
  mesh(box(.44,.06,.08), 0xe0566f, 0,-.17,-.12,head);
  const legGeo = box(.12,.3,.12); legGeo.translate(0,-.15,0);
  const legs = [[-.13,.28],[.13,.28],[-.13,-.26],[.13,-.26]].map(([x,z]) => mesh(legGeo, tan, x,.3,z,body));
  const tg = box(.08,.08,.3); tg.translate(0,0,-.15);

  const blob = new THREE.Mesh(new THREE.CircleGeometry(.4,14), new THREE.MeshBasicMaterial({ color:0x1d3a12, transparent:true, opacity:.2, depthWrite:false }));
  blob.rotation.x = -Math.PI/2; blob.position.y = .02; g.add(blob);

let player, arrow, marker, confetti;
function buildPlayer(){
  player = makeChibi({ skin:0xf2c9a0, cap:0x3f8f4a, shirt:0xf6f2ea, sleeve:0xf6f2ea, pants:0x3e6fb0, bib:0x3e6fb0, shoes:0x6b4226, pack:0x9b6a3c });
  const saved = store.get('pos2', null);
  if (saved && isFinite(saved.x) && isFinite(saved.z)) player.g.position.set(clamp(saved.x,-23,23), 0, clamp(saved.z,-23,25));
  else player.g.position.set(0, 0, 22.6);
  player.face = Math.PI; player.g.rotation.y = Math.PI;
  const as = new THREE.Shape(); as.moveTo(0,.5); as.lineTo(-.3,0); as.lineTo(-.1,0); as.lineTo(-.1,-.25); as.lineTo(.1,-.25); as.lineTo(.1,0); as.lineTo(.3,0); as.closePath();
  const ag = new THREE.ShapeGeometry(as); ag.rotateX(-Math.PI/2);
  arrow = new THREE.Mesh(ag, new THREE.MeshBasicMaterial({ color:0xf2b23a, transparent:true, opacity:.9, depthWrite:false })); arrow.renderOrder = 3; scene.add(arrow);
  marker = new THREE.Mesh(new THREE.RingGeometry(.28,.42,24), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:.85, depthWrite:false }));
  marker.rotation.x = -Math.PI/2; marker.visible = false; scene.add(marker);
  const CN = 110, cm = new THREE.InstancedMesh(new THREE.PlaneGeometry(.13,.22), new THREE.MeshBasicMaterial({ side:THREE.DoubleSide }), CN);
  cm.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(CN*3).fill(1), 3);
  const cols = [0xe0566f, 0xf2b23a, 0x3f86d0, 0x4f9a3a, 0x8d5bc9, 0xffffff];
  for (let i=0;i<CN;i++) cm.setColorAt(i, tmpC.setHex(cols[i % cols.length]));
  cm.count = 0; scene.add(cm);
  confetti = { mesh:cm, p:[], life:0 };
}
function burstConfetti(){
  const o = player.g.position; confetti.p = [];
  for (let i=0;i<confetti.mesh.instanceMatrix.count;i++){
    const a = R()*Math.PI*2, s = 2 + R()*4;
    confetti.p.push({ x:o.x, y:2.2, z:o.z, vx:Math.cos(a)*s, vy:5 + R()*5, vz:Math.sin(a)*s, r:R()*6, vr:(R()-.5)*14 });
  }
  confetti.mesh.count = confetti.p.length; confetti.life = 3.6;
}

function bindRsvp(){
  $('#rsvpForm').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('#rsvpName').value.trim();
    if (!name){ $('#rsvpName').focus(); toast('Isi nama dulu ya.'); return; }
    const att = (document.querySelector('input[name=att]:checked') || {}).value || 'Hadir';
    const count = $('#rsvpCount').value, msg = $('#rsvpMsg').value.trim();
    const prev = store.get('rsvp', {});
    store.set('rsvp', { name, att, count, msg, sent: !!prev.sent });
    const text = 'Halo ' + COUPLE + ', ini RSVP dari ' + name + '.\nKehadiran: ' + att + (att === 'Hadir' ? '\nJumlah orang: ' + count : '') + (msg ? '\nUcapan: ' + msg : '');

    const btn = $('#rsvpSubmit'), out = $('#rsvpOut');
    btn.disabled = true; btn.textContent = 'Mengirim…';
    try {
      const r = await fetch(RSVP_API, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ id:deviceId(), name, att, count, msg }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error('rsvp'), { code: j.error || r.status });
      store.set('rsvp', { name, att, count, msg, sent:true });
      out.hidden = false;
      out.innerHTML = `<p class="ok-msg" id="okMsg"></p>
        <div class="row"><a class="btn ghost" href="${waUrl}" target="_blank" rel="noopener">Kabari lewat WhatsApp juga</a></div>`;
      $('#okMsg').textContent = 'Terima kasih, ' + name + '! ' + (att === 'Hadir' ? 'Kursimu sudah disiapkan di depan pelaminan.' : 'Konfirmasimu sudah kami terima.') + (j.updated ? ' RSVP sebelumnya sudah diperbarui.' : '');
      btn.textContent = 'Perbarui RSVP';
      await loadSummary(true);
      $('#rsvpStats').innerHTML = statsHTML();
      if (guestPager) guestPager(true);
      loadTV(true);
      if (att === 'Hadir') toast('Kursimu sudah terisi. Cek di depan pelaminan!');
    } catch (err) {
      btn.textContent = prev.sent ? 'Perbarui RSVP' : 'Kirim RSVP';
      if (err.code === 'rate_limited'){ toast('Terlalu sering mengirim. Coba lagi beberapa menit lagi.', 3500); return; }
      out.hidden = false;
      out.innerHTML = `<p class="note">RSVP belum bisa disimpan saat ini. Kirim lewat WhatsApp dulu ya.</p><pre id="rsvpPre"></pre>
        <div class="row"><a class="btn" href="${waUrl}" target="_blank" rel="noopener">Kirim lewat WhatsApp</a>
        <button class="btn ghost" type="button" id="copyRsvp">Salin pesan</button></div>`;
      $('#rsvpPre').textContent = text;
      $('#copyRsvp').onclick = ev => copyText(text, ev.currentTarget);
    } finally {
      btn.disabled = false;
      out.scrollIntoView({ block:'nearest', behavior:'smooth' });
    }
  });
}

/* ---------- RSVP bersama (api/rsvp.js + Upstash) ---------- */
const RSVP_API = '/api/rsvp';
const rsvp = { ok:null, summary:null };
let guestPager = null, _dev = null;
function deviceId(){
  if (_dev) return _dev;
  let id = store.get('device', null);
  if (typeof id !== 'string' || !/^[A-Za-z0-9-]{8,64}$/.test(id)){ id = 'd-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); store.set('device', id); }
  return (_dev = id);
}
async function apiGet(params, fresh){
  const qs = new URLSearchParams(params || {}); if (fresh) qs.set('_', Date.now());
  const q = qs.toString();
  const r = await fetch(RSVP_API + (q ? '?' + q : ''), { headers:{ Accept:'application/json' } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error('api'), { code: j.error || r.status });
  return j;
}
async function loadSummary(fresh){
  try { const s = await apiGet(null, fresh); rsvp.ok = true; rsvp.summary = s; fillSeats(s.seated || []); return s; }
  catch (e){ rsvp.ok = false; return null; }
}
function statsHTML(){
  const s = rsvp.summary && rsvp.summary.stats; if (!s) return '';

  return `<div class="stats">${st(s.hadirOrang,'orang hadir')}${st(s.hadir,'konfirmasi hadir')}${st(s.ragu,'belum pasti')}${st(s.tidak,'tidak bisa')}</div>`;

const PILL = { 'Hadir':['h','HADIR'], 'Belum pasti':['r','BELUM PASTI'], 'Tidak bisa hadir':['t','TIDAK HADIR'] };
function pillEl(att){ const sp = document.createElement('span'); const p = PILL[att] || PILL['Belum pasti']; sp.className = 'pill ' + p[0]; sp.textContent = p[1]; return sp; }
function relTime(t){
  const d = (Date.now() - Number(t)) / 1000;
  if (!isFinite(d)) return '';
  if (d < 60) return 'baru saja';
  if (d < 3600) return Math.floor(d/60) + ' menit lalu';
  if (d < 86400) return Math.floor(d/3600) + ' jam lalu';
  if (d < 86400*7) return Math.floor(d/86400) + ' hari lalu';
  try { return new Date(Number(t)).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }); } catch (e){ return ''; }
}

function makePager(view, listEl, moreEl, render, emptyText){
  let off = 0, total = 0, loading = false;
  const tag = listEl.tagName === 'UL' ? 'li' : 'div';
  const note = text => { listEl.innerHTML = ''; const e = document.createElement(tag); e.className = 'empty'; e.textContent = text; listEl.appendChild(e); };
  async function next(reset){
    if (loading) return; loading = true;
    if (reset) off = 0;
    moreEl.hidden = true;
    if (off === 0) note('Memuat…');
    try {
      const j = await apiGet({ view, offset:off, limit:30 }, !!reset);
      if (off === 0) listEl.innerHTML = '';
      total = Number(j.total) || 0;
      (j.items || []).forEach(it => listEl.appendChild(render(it)));
      off += (j.items || []).length;
      if (!total) note(emptyText);
      moreEl.hidden = off >= total;
      moreEl.textContent = 'Muat lebih banyak (' + (total - off) + ' lagi)';
    } catch (e){
      note('Daftar tamu belum bisa dimuat saat ini. Coba lagi nanti.');
    }
    loading = false;
  }
  moreEl.onclick = () => next(false);
  return next;
}

/* ---------- music box (original melody, WebAudio) ---------- */
const MEL = [72,0,76,79,84,0,79,76, 81,0,79,76,72,0,74,76, 77,0,81,84,81,0,77,74, 79,0,76,74,71,0,74,0,

const BASS = [48,55,45,52,41,48,43,50,48,55,45,52,41,43,48,48];
let actx = null, master = null, musicOn = false, mTimer = 0, nextT = 0, step = 0;
const BEAT = .27, midi = n => 440 * Math.pow(2, (n - 69)/12);
function tone(f, t, d, v, type){
  const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05);
}
function sched(){
  while (nextT < actx.currentTime + .3){
    const n = MEL[step % MEL.length]; if (n) tone(midi(n), nextT, .55, .14, 'triangle');
    if (step % 4 === 0) tone(midi(BASS[(step/4|0) % BASS.length]), nextT, 1.0, .09, 'sine');
    nextT += BEAT; step++;
  }
}
function setMusic(on){
  try {
    if (on){
      if (!actx){ actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = .5; master.connect(actx.destination); }
      actx.resume(); nextT = actx.currentTime + .05; clearInterval(mTimer); mTimer = setInterval(sched, 100); sched();
    } else { clearInterval(mTimer); }
  } catch(e){ on = false; }
  musicOn = on;
  const b = $('#btnMusic'); b.classList.toggle('off', !on); b.setAttribute('aria-pressed', String(on)); b.textContent = on ? '♪ Musik' : '♪ Musik mati';
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), gPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0), hitP = new THREE.Vector3();

/* ---------- physics ---------- */
function collide(p, r){
  for (const c of COLC){ const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), m = c.r + r; if (d < m && d > 1e-4){ p.x = c.x + dx/d*m; p.z = c.z + dz/d*m; } }
  for (const b of COLB){
    const ox = b.hw + r - Math.abs(p.x - b.x), oz = b.hd + r - Math.abs(p.z - b.z);
    if (ox > 0 && oz > 0){ if (ox < oz) p.x += Math.sign(p.x - b.x || 1) * ox; else p.z += Math.sign(p.z - b.z || 1) * oz; }
  }
  p.x = clamp(p.x, -23.3, 23.3); p.z = clamp(p.z, -23.3, 25.3);
}

/* ---------- main update ---------- */
let lastNearKey = '';
function update(dt){
  T += dt;
  const pp = player.g.position;
  // movement intent
  let mx = 0, mz = 0;
  if (!busy()){
    mx = joy.x + ((keys.d||keys.arrowright) ? 1 : 0) - ((keys.a||keys.arrowleft) ? 1 : 0);
    mz = joy.y + ((keys.s||keys.arrowdown) ? 1 : 0) - ((keys.w||keys.arrowup) ? 1 : 0);
    const l = Math.hypot(mx, mz);
    if (l > .12){ walkTo = null; marker.visible = false; if (l > 1){ mx /= l; mz /= l; } }
    else { mx = mz = 0;
      if (walkTo){
        const dx = walkTo.x - pp.x, dz = walkTo.z - pp.z, d = Math.hypot(dx, dz);
        const it = walkTo.inter;
        if (it){ const ip = interPos(it); if (Math.hypot(ip.x - pp.x, ip.z - pp.z) < it.reach - .25){ walkTo = null; marker.visible = false; it.run(); } }
        if (walkTo){
          if (d < .25){ walkTo = null; marker.visible = false; }
          else { mx = dx/d; mz = dz/d; if (d < .8){ mx *= d/.8; mz *= d/.8; }

            if (stuckT > .9){ walkTo = null; marker.visible = false; } }
        }
      }
    }
  }

  if (moving){
    const sp = 5.2 * Math.min(1, mv);
    pp.x += mx*sp*dt; pp.z += mz*sp*dt;
    player.face = lerpAng(player.face, Math.atan2(mx, mz), Math.min(1, dt*14));
  }
  collide(pp, .42);
  player.g.rotation.y = player.face;
  animChibi(player, moving, dt, T);

  // dog follows
  const dp = dog.g.position, bx = pp.x - Math.sin(player.face)*1.5 + Math.cos(player.face)*.7, bz = pp.z - Math.cos(player.face)*1.5 - Math.sin(player.face)*.7;
  const ddx = bx - dp.x, ddz = bz - dp.z, dd = Math.hypot(ddx, ddz), dMoving = dd > .5;
  if (dMoving){ const s = Math.min(6.2, dd*2.6); dp.x += ddx/dd*s*dt; dp.z += ddz/dd*s*dt; dog.face = lerpAng(dog.face, Math.atan2(ddx, ddz), Math.min(1, dt*8)); }

  dog.legs.forEach((l,i) => l.rotation.x = dMoving ? Math.sin(dog.phase + (i%2 ? 0 : Math.PI) + (i>1 ? Math.PI : 0)) * .6 : 0);
  dog.tail.rotation.y = Math.sin(T * (dog.hop > 0 ? 26 : 10)) * .6;
  if (dog.hop > 0){ dog.hop = Math.max(0, dog.hop - dt*1.4); dog.body.position.y = Math.abs(Math.sin(dog.hop*Math.PI*3)) * .35; } else dog.body.position.y = 0;

  // couple idles and looks at player
  const nearCouple = Math.hypot(pp.x, pp.z + 18.5) < 9;
  [couple.groom, couple.bride].forEach((c, i) => {
    animChibi(c, false, dt, T + i);
    const want = nearCouple ? Math.atan2(pp.x - c.g.position.x, pp.z - c.g.position.z) : 0;
    c.face = lerpAng(c.face, clamp(want, -1.1, 1.1), Math.min(1, dt*3)); c.g.rotation.y = c.face;
  });
  couple.heart.rotation.y += dt*1.4; couple.heart.position.y = couple.heartY + Math.sin(T*2)*.15;
  couple.ring.material.opacity = .35 + Math.sin(T*3)*.15;

  animateSeats(dt);
  // pillars
  PILLARS.forEach((p, i) => {
    p.icon.rotation.y += dt*1.1; p.icon.position.y = 4.2 + Math.sin(T*2 + i)*.16;
    p.ring.material.opacity = (visited.includes(p.id) ? .45 : .4 + Math.sin(T*3 + i)*.2);
  });

  // petals
  const pa = petals.geometry.attributes.position, sp = petals.userData.sp;
  for (let i=0;i<pa.count;i++){
    let y = pa.getY(i) - sp[i*2]*dt; if (y < 0) y = 6 + R()*1.5;
    pa.setY(i, y); pa.setX(i, pa.getX(i) + Math.sin(T*1.3 + sp[i*2+1])*dt*.35);
  }
  pa.needsUpdate = true;

  // air mancur kolam
  if (fountainFx){
    const fa = fountainFx.geometry.attributes.position, ph = fountainFx.userData.ph, fx = fountainFx.userData.fx, per = fa.count / fx.length;
    for (let i=0;i<fa.count;i++){
      const f = fx[(i / per) | 0], t = (T*.9*ph[i*3+2] + ph[i*3]) % 1, a = ph[i*3+1], r = t * .55;
      fa.setXYZ(i, f[0] + Math.cos(a)*r, .55 + 2.6*t - 2.6*t*t, f[1] + Math.sin(a)*r);
    }
    fa.needsUpdate = true;
  }

  // masuk / keluar gedung (pakai histeresis supaya tidak kedip di ambang pintu)
  const inX = pp.x > BLD.x0 && pp.x < BLD.x1 && pp.z > BLD.z0;
  const ins = inX && (inside ? pp.z < BLD.z1 + .4 : pp.z < BLD.z1 - .5);
  if (ins !== inside){
    inside = ins;
    if (ins && !store.get('entered', false)){ store.set('entered', true); toast('Selamat datang di Grand Ballroom! Info ada di sekeliling ruangan.', 3800); }
  }
  const fadeTarget = inside ? 0 : 1;
  if (extFade !== fadeTarget){ extFade = clamp(extFade + Math.sign(fadeTarget - extFade) * dt / .85, 0, 1); applyExtFade(extFade); }
  insideK += ((inside ? 1 : 0) - insideK) * Math.min(1, dt*2.4);
  hemi.intensity = .62 + insideK*.16; sun.intensity = .8 - insideK*.18;
  // pintu kaca geser
  const wantOpen = (inside || Math.hypot(pp.x, pp.z - BLD.z1) < 5.5) ? 1 : 0;
  doorOpen += (wantOpen - doorOpen) * Math.min(1, dt*4);
  doors.l.position.x = -BLD.door/2 - doorOpen*(BLD.door - .15); doors.r.position.x = BLD.door/2 + doorOpen*(BLD.door - .15);
  // doorman menoleh ke tamu
  if (doorman){ const dd2 = Math.hypot(pp.x - doorman.g.position.x, pp.z - doorman.g.position.z); doorman.face = lerpAng(doorman.face, dd2 < 7 ? Math.atan2(pp.x - doorman.g.position.x, pp.z - doorman.g.position.z) : 0, Math.min(1, dt*3)); doorman.g.rotation.y = doorman.face; animChibi(doorman, false, dt, T + 2); }
  // TV LED (digambar ulang ~30 fps saat terlihat)
  tvState.last += dt;
  if (extFade < 1 && tvState.last > 1/30){ drawTV(tvState.last); tvState.last = 0; }
  for (const gs of chandGlows) gs.material.opacity = .75 + Math.sin(T*2.3 + gs.id)*.12;

  // confetti
  if (confetti.life > 0){
    confetti.life -= dt;
    confetti.p.forEach((c, i) => {
      c.vy -= 9.8*dt; c.vx *= .985; c.vz *= .985; c.x += c.vx*dt; c.y = Math.max(.05, c.y + c.vy*dt); c.z += c.vz*dt; c.r += c.vr*dt;
      if (c.y <= .05){ c.vy = 0; c.vx *= .8; c.vz *= .8; c.vr *= .9; }
      dummy.position.set(c.x, c.y, c.z); dummy.rotation.set(c.r, c.r*.7, 0); dummy.scale.setScalar(Math.min(1, confetti.life)); dummy.updateMatrix();
      confetti.mesh.setMatrixAt(i, dummy.matrix);
    });
    confetti.mesh.instanceMatrix.needsUpdate = true;
    if (confetti.life <= 0) confetti.mesh.count = 0;
  }

  // nearest interaction
  let best = null, bd = 1e9;
  INTER.forEach(it => { const p = interPos(it), d = Math.hypot(p.x - pp.x, p.z - pp.z); if (d < it.reach && d < bd){ bd = d; best = it; } });
  nearest = best;
  const nk = best ? best.key : '';
  if (nk !== lastNearKey){
    lastNearKey = nk;
    $('#btnA').disabled = !best; $('#actLabel').hidden = !best;
    if (best) $('#actLabel').textContent = best.label;
  }

  // compass arrow to nearest unvisited pillar
  let tgt = null, td = 1e9;
  PILLARS.forEach(p => { if (visited.includes(p.id)) return; const d = Math.hypot(p.x - pp.x, p.z - pp.z); if (d < td){ td = d; tgt = p; } });
  if (tgt && td > 4.2 && started && !busy()){
    const gx = inside ? tgt.x : 0, gz = inside ? tgt.z : BLD.z1 + .5;
    const dx = gx - pp.x, dz = gz - pp.z, d = Math.hypot(dx, dz) || 1;
    arrow.visible = true; arrow.position.set(pp.x + dx/d*1.2, .08, pp.z + dz/d*1.2); arrow.rotation.y = Math.atan2(-dx, -dz);
    arrow.material.opacity = .65 + Math.sin(T*5)*.25;
  } else arrow.visible = false;
  if (marker.visible){ marker.scale.setScalar(1 + Math.sin(T*8)*.12); }

  // dialog typewriter
  if (dlg.open && dlg.typing){
    dlg.shown += dt * 48; const n = Math.min(dlg.full.length, Math.floor(dlg.shown));
    $('#dlgText').textContent = dlg.full.slice(0, n); if (n >= dlg.full.length) dlg.typing = false;
  }

  // camera
  const portrait = innerHeight > innerWidth;
  if (!started){
    const a = Math.sin(T*.12)*.6; camera.position.set(Math.sin(a)*44, 16, 4 + Math.cos(a)*44); camera.lookAt(0, 8, -4);
    camTarget.set(pp.x, 0, pp.z);
  } else {
    camTarget.x += (pp.x - camTarget.x) * Math.min(1, dt*5); camTarget.z += (pp.z - camTarget.z) * Math.min(1, dt*5);
    const k = insideK*insideK*(3 - 2*insideK);
    const offIn = portrait ? [25, 22] : [17.5, 16], offOut = portrait ? [9.5, 22] : [8, 17];
    const oy = offOut[0] + (offIn[0] - offOut[0])*k, oz = offOut[1] + (offIn[1] - offOut[1])*k;
    const want = V3(camTarget.x, oy*zoom, camTarget.z + oz*zoom);
    camera.position.lerp(want, Math.min(1, dt*3));
    const lookAhead = (portrait ? 10 : 7)*(1 - k), lookY = .8 + (portrait ? 5.7 : 4.2)*(1 - k);
    camera.lookAt(camTarget.x, lookY, camTarget.z - lookAhead - (portrait ? .6 : 0)*k);
    const fov = (portrait ? 46 : 40) + ((portrait ? 38 : 34) - (portrait ? 46 : 40))*k;
    if (Math.abs(camera.fov - fov) > .01){ camera.fov = fov; camera.updateProjectionMatrix(); }
  }
}

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.fov = innerHeight > innerWidth ? 38 : 34; camera.updateProjectionMatrix();
}
let lastT = 0;
function loop(now){
  const dt = Math.min(.05, (now - (lastT || now)) / 1000); lastT = now;
  update(dt); renderer.render(scene, camera); requestAnimationFrame(loop);
}

function boot(){
  if (!window.THREE || !THREE.BufferGeometryUtils){ $('#err').hidden = false; return; }
  BGU = THREE.BufferGeometryUtils;
  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.domElement.id = 'scene'; document.body.prepend(renderer.domElement);
  scene = new THREE.Scene();
  scene.background = canvasTex(4, 256, (c, w, h) => { const g = c.createLinearGradient(0,0,0,h); g.addColorStop(0,'#6fa3d8'); g.addColorStop(.5,'#a9c8e6'); g.addColorStop(.78,'#f3d3b0'); g.addColorStop(1,'#f0bf92'); c.fillStyle = g; c.fillRect(0,0,w,h); });
  scene.fog = new THREE.Fog(0xeccdb0, 55, 105);
  camera = new THREE.PerspectiveCamera(38, 1, .5, 200);
  hemi = new THREE.HemisphereLight(0xe8eeff, 0x7a6a55, .62); scene.add(hemi);
  sun = new THREE.DirectionalLight(0xffdcb0, .8); sun.position.set(22, 30, 18); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024); const sc = sun.shadow.camera; sc.left = -30; sc.right = 30; sc.top = 30; sc.bottom = -30; sc.near = 1; sc.far = 100;
  sun.shadow.bias = -.0008; sun.shadow.normalBias = .03; scene.add(sun);

  buildGround(); buildBoundary(); buildBuilding(); buildForecourt(); buildDoorman(); buildPillars(); buildInterior(); buildGuests();
  buildTrees(); scatter(); flushSB(); applyExtFade(1);
  buildAnimals(); buildPlayer();
  [['couple', 0, -18.5, 1.6, 3.6, 0], ['sign', 3.9, 23.3, 1.1, 2.6, 0], ['tv', 11, -21.3, 3.8, 4.4, 1.75], ['doorman', 4.7, BLD.z1 + 1.5, .6, 2.2, 0]].forEach(([k, x, z, w, h, y0]) => {
    const pr = new THREE.Mesh(box(w*2, h, 1.6), new THREE.MeshBasicMaterial()); pr.visible = false; pr.position.set(x, y0 + h/2, z); pr.userData.inter = k; scene.add(pr); PICK.push(pr);
  });
  registerInteractions();
  camTarget = V3(player.g.position.x, 0, player.g.position.z);
  document.title = 'Undangan ' + COUPLE;
  bindUI(); resize();
  requestAnimationFrame(loop);
  loadSummary().then(() => loadTV());
  setInterval(() => { if (!document.hidden && rsvp.ok){ loadSummary(); loadTV(); } }, 120000);
}
Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1800))]).then(boot);
</script>
